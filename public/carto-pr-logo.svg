      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: 42px; fill: #001f9c; letter-spacing: 12px; }
